<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Villa Velha Pub — Reserva de Mesas</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a0f0a 0%, #3a2413 50%, #1a0f0a 100%);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 20px; color: #f5e9dc;
    }
    .card {
      background: #2b1a0e; border: 1px solid #c9a227; border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6); width: 100%; max-width: 520px; padding: 40px 35px;
    }
    .logo { text-align: center; margin-bottom: 30px; }
    .logo h1 { font-size: 28px; letter-spacing: 2px; color: #e0b84d; text-transform: uppercase; }
    .logo p { margin-top: 6px; font-size: 14px; color: #b89a6a; letter-spacing: 1px; }
    .divider { border: none; border-top: 1px solid #c9a227; opacity: 0.4; margin: 20px 0 28px; }
    .form-group { margin-bottom: 22px; }
    label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #e0b84d; }
    input, textarea, select {
      width: 100%; padding: 12px 14px; font-size: 15px; border: 1px solid #6b4f2e;
      border-radius: 8px; background: #1a0f0a; color: #f5e9dc; transition: border-color 0.2s;
    }
    select {
      appearance: none; -webkit-appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23e0b84d' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat; background-position: right 14px center; cursor: pointer;
    }
    select option { background: #2b1a0e; color: #f5e9dc; }
    input:focus, textarea:focus, select:focus { outline: none; border-color: #e0b84d; }
    input::placeholder, textarea::placeholder { color: #7a6a55; }
    .date-wrapper { position: relative; }
    .date-input { cursor: pointer; background: #1a0f0a; text-align: left; }
    .calendar-popup {
      display: none; position: absolute; top: calc(100% + 8px); left: 0; z-index: 20;
      background: #2b1a0e; border: 1px solid #c9a227; border-radius: 12px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.7); padding: 14px; width: 300px;
    }
    .calendar-popup.open { display: block; }
    .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .cal-header button { background: none; border: none; color: #e0b84d; font-size: 20px; cursor: pointer; padding: 4px 10px; border-radius: 6px; }
    .cal-header button:hover { background: #3a2413; }
    .cal-title { font-weight: 700; color: #e0b84d; font-size: 15px; }
    .cal-weekdays { display: grid; grid-template-columns: repeat(7,1fr); text-align: center; margin-bottom: 6px; }
    .cal-weekdays span { font-size: 12px; font-weight: 700; color: #b89a6a; padding: 4px 0; }
    .cal-days { display: grid; grid-template-columns: repeat(7,1fr); gap: 3px; }
    .cal-day { text-align: center; padding: 8px 0; border-radius: 6px; cursor: pointer; font-size: 13px; color: #f5e9dc; transition: background 0.15s; }
    .cal-day:hover { background: #3a2413; }
    .cal-day.empty { cursor: default; }
    .cal-day.empty:hover { background: none; }
    .cal-day.today { border: 1px solid #c9a227; font-weight: 700; }
    .cal-day.selected { background: #e0b84d; color: #1a0f0a; font-weight: 700; }
    .cal-day.past { color: #5a4632; cursor: not-allowed; }
    .cal-day.past:hover { background: none; }
    .char-counter { text-align: right; font-size: 12px; color: #b89a6a; margin-top: 5px; }
    .char-counter.limit { color: #e05d4d; font-weight: 700; }
    .btn {
      width: 100%; padding: 14px; font-size: 16px; font-weight: 700; letter-spacing: 1px;
      text-transform: uppercase; color: #1a0f0a; background: linear-gradient(135deg, #e0b84d, #c9a227);
      border: none; border-radius: 8px; cursor: pointer; margin-top: 8px; transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(224,184,77,0.3); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .error { color: #e05d4d; font-size: 13px; margin-top: 6px; display: none; }
    .success {
      display: none; text-align: center; background: #1d3a24; border: 1px solid #4caf50;
      color: #a5d6a7; padding: 14px; border-radius: 8px; margin-top: 18px; font-weight: 600;
    }
    .loading { display: none; text-align: center; color: #e0b84d; font-weight: 600; margin-top: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <h1>🍺 Villa Velha Pub</h1>
      <p>Reserva de Mesas</p>
    </div>
    <hr class="divider">

    <form id="reservaForm" novalidate>
      <div class="form-group">
        <label for="dataReserva">Data de Reserva *</label>
        <div class="date-wrapper">
          <input type="text" id="dataReserva" class="date-input" placeholder="Selecione a data" readonly>
          <div class="calendar-popup" id="calendarPopup">
            <div class="cal-header">
              <button type="button" id="prevMonth">◀</button>
              <span class="cal-title" id="calTitle"></span>
              <button type="button" id="nextMonth">▶</button>
            </div>
            <div class="cal-weekdays">
              <span>Dom</span><span>Seg</span><span>Ter</span><span>Qua</span>
              <span>Qui</span><span>Sex</span><span>Sáb</span>
            </div>
            <div class="cal-days" id="calDays"></div>
          </div>
        </div>
        <div class="error" id="erroData">Selecione uma data válida (hoje ou futura).</div>
      </div>

      <div class="form-group">
        <label for="nomeReserva">Nome da Reserva *</label>
        <input type="text" id="nomeReserva" placeholder="Ex.: João Silva" maxlength="60" required>
        <div class="error" id="erroNome">Informe o nome da reserva.</div>
      </div>

      <div class="form-group">
        <label for="telefone">Telefone *</label>
        <input type="tel" id="telefone" placeholder="(00) 00000-0000" maxlength="15" required>
        <div class="error" id="erroTelefone">Informe um telefone válido com DDD.</div>
      </div>

      <div class="form-group">
        <label for="quantidadeLugares">Quantidade de Lugares *</label>
        <input type="number" id="quantidadeLugares" min="1" max="50" placeholder="Ex.: 4" required>
        <div class="error" id="erroLugares">Informe entre 1 e 50 lugares.</div>
      </div>

      <div class="form-group">
        <label for="motivoReserva">Motivo da Reserva *</label>
        <select id="motivoReserva" required>
          <option value="" disabled selected>Selecione o motivo</option>
          <option value="Aniversário">Aniversário</option>
          <option value="Corporativo">Corporativo</option>
          <option value="Família">Família</option>
          <option value="Turma da Firma">Turma da Firma</option>
          <option value="Outros">Outros</option>
        </select>
        <div class="error" id="erroMotivo">Selecione o motivo da reserva.</div>
      </div>

      <div class="form-group">
        <label for="observacao">Observação</label>
        <textarea id="observacao" rows="3" maxlength="50" placeholder="Máx. 50 caracteres"></textarea>
        <div class="char-counter" id="contador">0 / 50</div>
      </div>

      <button type="submit" class="btn" id="btnEnviar">Confirmar Reserva</button>
      <div class="loading" id="loading">Enviando reserva...</div>
      <div class="success" id="mensagemSucesso">✅ Reserva registrada com sucesso!</div>
    </form>
  </div>

  <script>
    // ===== Configuração =====
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyQgdPbxLYCTl_X1A1-wN8NmrGHkRyKJR6xeOrCopBXS1JujMFAeoonhBNMnLlM1llEbw/exec';

    // ===== Calendário customizado =====
    const dataReserva = document.getElementById('dataReserva');
    const calendarPopup = document.getElementById('calendarPopup');
    const calTitle = document.getElementById('calTitle');
    const calDays = document.getElementById('calDays');
    const hoje = new Date();
    hoje.setHours(0, 0, 0, 0);
    let dataSelecionada = null;
    let mesAtual = hoje.getMonth();
    let anoAtual = hoje.getFullYear();
    const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

    function formatarData(d) {
      const dd = String(d.getDate()).padStart(2, '0');
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      return d.getFullYear() + '-' + mm + '-' + dd;
    }

    function renderCalendario() {
      calTitle.textContent = MESES[mesAtual] + ' ' + anoAtual;
      calDays.innerHTML = '';
      const primeiroDia = new Date(anoAtual, mesAtual, 1);
      const diasNoMes = new Date(anoAtual, mesAtual + 1, 0).getDate();
      const inicioSemana = primeiroDia.getDay();
      for (let i = 0; i < inicioSemana; i++) {
        const vazio = document.createElement('div');
        vazio.className = 'cal-day empty';
        calDays.appendChild(vazio);
      }
      for (let dia = 1; dia <= diasNoMes; dia++) {
        const celula = document.createElement('div');
        celula.className = 'cal-day';
        celula.textContent = dia;
        const data = new Date(anoAtual, mesAtual, dia);
        const dataStr = formatarData(data);
        if (data < hoje) {
          celula.classList.add('past');
        } else {
          if (dataStr === formatarData(hoje)) celula.classList.add('today');
          if (dataStr === dataSelecionada) celula.classList.add('selected');
          celula.addEventListener('click', function (e) {
            e.stopPropagation();
            dataSelecionada = dataStr;
            dataReserva.value = dia + '/' + (mesAtual + 1) + '/' + anoAtual;
            calendarPopup.classList.remove('open');
            renderCalendario();
          });
        }
        calDays.appendChild(celula);
      }
    }

    dataReserva.addEventListener('click', function (e) {
      e.stopPropagation();
      calendarPopup.classList.toggle('open');
      renderCalendario();
    });
    document.getElementById('prevMonth').addEventListener('click', function (e) {
      e.stopPropagation();
      mesAtual--;
      if (mesAtual < 0) { mesAtual = 11; anoAtual--; }
      renderCalendario();
    });
    document.getElementById('nextMonth').addEventListener('click', function (e) {
      e.stopPropagation();
      mesAtual++;
      if (mesAtual > 11) { mesAtual = 0; anoAtual++; }
      renderCalendario();
    });
    document.addEventListener('click', function (e) {
      if (!e.target.closest('.date-wrapper')) calendarPopup.classList.remove('open');
    });

    // ===== Campos =====
    const form = document.getElementById('reservaForm');
    const nomeReserva = document.getElementById('nomeReserva');
    const telefone = document.getElementById('telefone');
    const quantidadeLugares = document.getElementById('quantidadeLugares');
    const motivoReserva = document.getElementById('motivoReserva');
    const observacao = document.getElementById('observacao');
    const contador = document.getElementById('contador');
    const mensagemSucesso = document.getElementById('mensagemSucesso');
    const loading = document.getElementById('loading');
    const btnEnviar = document.getElementById('btnEnviar');

    observacao.addEventListener('input', function () {
      const len = this.value.length;
      contador.textContent = len + ' / 50';
      contador.classList.toggle('limit', len >= 50);
    });

    telefone.addEventListener('input', function () {
      const digits = this.value.replace(/\D/g, '').slice(0, 11);
      let formatted = '';
      if (digits.length <= 2) formatted = '(' + digits;
      else if (digits.length <= 6) formatted = '(' + digits.slice(0, 2) + ') ' + digits.slice(2);
      else if (digits.length <= 10) formatted = '(' + digits.slice(0, 2) + ') ' + digits.slice(2, 6) + '-' + digits.slice(6);
      else formatted = '(' + digits.slice(0, 2) + ') ' + digits.slice(2, 7) + '-' + digits.slice(7);
      this.value = formatted;
    });

    // ===== Envio =====
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      mensagemSucesso.style.display = 'none';
      let valido = true;
      if (!dataSelecionada) { document.getElementById('erroData').style.display = 'block'; valido = false; }
      else { document.getElementById('erroData').style.display = 'none'; }
      if (!nomeReserva.value.trim()) { document.getElementById('erroNome').style.display = 'block'; valido = false; }
      else { document.getElementById('erroNome').style.display = 'none'; }
      const telefoneDigits = telefone.value.replace(/\D/g, '');
      if (telefoneDigits.length < 10 || telefoneDigits.length > 11) { document.getElementById('erroTelefone').style.display = 'block'; valido = false; }
      else { document.getElementById('erroTelefone').style.display = 'none'; }
      const lugares = parseInt(quantidadeLugares.value, 10);
      if (!lugares || lugares < 1 || lugares > 50) { document.getElementById('erroLugares').style.display = 'block'; valido = false; }
      else { document.getElementById('erroLugares').style.display = 'none'; }
      if (!motivoReserva.value) { document.getElementById('erroMotivo').style.display = 'block'; valido = false; }
      else { document.getElementById('erroMotivo').style.display = 'none'; }
      if (!valido) return;

      const reserva = {
        data: dataSelecionada,
        nome: nomeReserva.value.trim(),
        telefone: telefone.value.trim(),
        lugares: lugares,
        motivo: motivoReserva.value,
        observacao: observacao.value.trim()
      };

      btnEnviar.disabled = true;
      loading.style.display = 'block';

      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(reserva)
      })
      .then(function () {
        loading.style.display = 'none';
        btnEnviar.disabled = false;
        mensagemSucesso.style.display = 'block';
        form.reset();
        contador.textContent = '0 / 50';
        dataSelecionada = null;
      })
      .catch(function () {
        loading.style.display = 'none';
        btnEnviar.disabled = false;
        alert('Erro ao enviar a reserva. Tente novamente.');
      });
    });
  </script>
</body>
</html>
