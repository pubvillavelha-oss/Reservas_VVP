<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Villa Velha Pub - Reserva de Mesa</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #14141f; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .card { background: #1e1e2e; border-radius: 12px; padding: 28px; width: 100%; max-width: 460px; }
  h1 { text-align: center; font-size: 22px; margin-bottom: 4px; }
  .sub { text-align: center; color: #aaa; font-size: 13px; margin-bottom: 20px; }

  label { display: block; font-size: 13px; color: #ccc; margin: 12px 0 4px; }
  input, select, textarea {
    width: 100%; padding: 10px 12px; border-radius: 6px;
    border: 1px solid #444; background: #14141f; color: #fff; font-size: 14px;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: #00c864; }

  .campo-mesa {
    display: flex; align-items: center; gap: 10px;
    background: #14141f; border: 1px solid #444; border-radius: 6px; padding: 10px 12px;
  }
  .campo-mesa input { border: none; background: transparent; padding: 0; font-size: 14px; }
  .campo-mesa .trocar { color: #00c864; font-size: 12px; cursor: pointer; white-space: nowrap; text-decoration: underline; }

  .btn { width: 100%; padding: 13px; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 18px; }
  .btn-enviar { background: #00c864; color: #fff; }
  .btn-enviar:disabled { background: #2a5a40; color: #888; cursor: not-allowed; }

  .msg { margin-top: 14px; font-size: 13px; padding: 10px; border-radius: 6px; background: #2a2a3e; display: none; }
  .msg.erro { border-left: 4px solid #ff4444; }
  .msg.ok { border-left: 4px solid #00c864; }
</style>
</head>
<body>

<div class="card">
  <h1>🍺 Villa Velha Pub</h1>
  <p class="sub">Preencha seus dados para confirmar a reserva</p>

  <form id="formReserva">
    <label for="data">📅 Data da reserva</label>
    <input type="date" id="data" required>

    <label for="nome">👤 Nome</label>
    <input type="text" id="nome" placeholder="Seu nome completo" required>

    <label for="telefone">📱 Telefone / WhatsApp</label>
    <input type="tel" id="telefone" placeholder="(00) 00000-0000" required>

    <label for="lugares">🪑 Quantidade de lugares</label>
    <select id="lugares" required>
      <option value="">Selecione...</option>
      <option value="2">2 pessoas</option>
      <option value="4">4 pessoas</option>
      <option value="6">6 pessoas</option>
      <option value="8">8 pessoas</option>
      <option value="10">10 pessoas</option>
      <option value="12">12 pessoas</option>
    </select>

    <label for="motivo">🎉 Motivo da reserva</label>
    <select id="motivo">
      <option value="">Selecione (opcional)</option>
      <option value="Aniversário">Aniversário</option>
      <option value="Confraternização">Confraternização</option>
      <option value="Encontro">Encontro</option>
      <option value="Show">Show</option>
      <option value="Outro">Outro</option>
    </select>

    <label for="observacao">📝 Observações</label>
    <textarea id="observacao" rows="2" placeholder="Alguma observação? (opcional)"></textarea>

    <label>🪑 Mesa selecionada</label>
    <div class="campo-mesa">
      <input type="text" id="mesa" placeholder="Nenhuma mesa selecionada" readonly>
      <span class="trocar" onclick="trocarMesa()">Trocar</span>
    </div>

    <button type="submit" class="btn btn-enviar" id="btnEnviar">Confirmar reserva</button>
    <div class="msg" id="msg"></div>
  </form>
</div>

<script>
  // ============================================================
  // CONFIGURAÇÃO — preencha com a URL real do seu Apps Script
  // ============================================================
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyQgdPbxLYCTl_X1A1-wN8NmrGHkRyKJR6xeOrCopBXS1JujMFAeoonhBNMnLlM1llEbw/exec';
  // ============================================================

  const form = document.getElementById('formReserva');
  const msg = document.getElementById('msg');
  const btnEnviar = document.getElementById('btnEnviar');

  // ===== Lê a mesa escolhida no mesa.html =====
  // Prioridade: parâmetro da URL (?mesa=12) -> localStorage -> vazio
  function lerMesa() {
    const params = new URLSearchParams(window.location.search);
    const daUrl = params.get('mesa');
    const doStorage = localStorage.getItem('vvp_mesa');
    return daUrl || doStorage || '';
  }

  // ===== Lê a data escolhida no mesa.html (se houver) =====
  function lerData() {
    const params = new URLSearchParams(window.location.search);
    const daUrl = params.get('data');
    const doStorage = localStorage.getItem('vvp_data');
    return daUrl || doStorage || '';
  }

  // Preenche os campos com o que veio do mesa.html
  document.getElementById('mesa').value = lerMesa();
  document.getElementById('data').value = lerData() || dataHoje();

  // ===== Envio do formulário =====
  form.addEventListener('submit', async function (e) {
    e.preventDefault();

    const mesa = document.getElementById('mesa').value;
    if (!mesa) {
      mostrarMsg('erro', '⚠️ Selecione uma mesa no mapa antes de reservar.');
      return;
    }

    const payload = {
      data: document.getElementById('data').value,
      nome: document.getElementById('nome').value,
      telefone: document.getElementById('telefone').value,
      lugares: document.getElementById('lugares').value,
      motivo: document.getElementById('motivo').value,
      observacao: document.getElementById('observacao').value,
      mesa: mesa
    };

    btnEnviar.disabled = true;
    btnEnviar.textContent = 'Enviando...';
    mostrarMsg('', '');

    try {
      const res = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(payload)
      });

      // Com mode:'no-cors' não lemos a resposta; assumimos sucesso.
      // O Apps Script rejeita mesa duplicada — por isso o aviso abaixo.
      mostrarMsg('ok', '✅ Reserva enviada! Aguarde a confirmação do Villa Velha Pub.');
      localStorage.removeItem('vvp_mesa');
      localStorage.removeItem('vvp_data');
      form.reset();
      document.getElementById('mesa').value = '';
    } catch (err) {
      mostrarMsg('erro', '❌ Erro ao enviar. Verifique sua conexão e tente novamente.');
      console.error(err);
    } finally {
      btnEnviar.disabled = false;
      btnEnviar.textContent = 'Confirmar reserva';
    }
  });

  // ===== Trocar mesa: volta para o mapa =====
  function trocarMesa() {
    window.location.href = 'mesa.html';
  }

  // ===== Auxiliares =====
  function dataHoje() {
    const hoje = new Date();
    return hoje.getFullYear() + '-' +
      String(hoje.getMonth() + 1).padStart(2, '0') + '-' +
      String(hoje.getDate()).padStart(2, '0');
  }

  function mostrarMsg(tipo, texto) {
    msg.className = 'msg ' + tipo;
    msg.textContent = texto;
    msg.style.display = texto ? 'block' : 'none';
  }
</script>
</body>
</html>
