  <script>
    // ===== Configuração =====
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyQgdPbxLYCTl_X1A1-wN8NmrGHkRyKJR6xeOrCopBXS1JujMFAeoonhBNMnLlM1llEbw/exec';
    const CAPACIDADE_MESA = 6;
    const LIMITE_PESSOAS = 160;
    const MAX_MESA = 45;
    const VALOR_MESA = 20; // R$ por mesa

    const HORARIOS_ABERTURA = {
      0: { h: 20, m: 0 },
      4: { h: 20, m: 30 },
      5: { h: 21, m: 0 },
      6: { h: 21, m: 0 }
    };
    const ANTECEDENCIA_MIN = 120;

    let AGENDA = {};
    let linkTaxa = null;
    let cliqueLinkTaxa = '';
    let totalPessoasData = 0;
    let limiteAtingido = false;
    let mesasOcupadas = [];

    const dataReserva = document.getElementById('dataReserva');
    const calendarPopup = document.getElementById('calendarPopup');
    const calTitle = document.getElementById('calTitle');
    const calDays = document.getElementById('calDays');
    const avisoSemData = document.getElementById('avisoSemData');
    const mapaContainer = document.getElementById('mapaContainer');
    const bannerLimite = document.getElementById('bannerLimite');
    const form = document.getElementById('reservaForm');
    const nomeReserva = document.getElementById('nomeReserva');
    const telefone = document.getElementById('telefone');
    const emailReserva = document.getElementById('emailReserva');
    const erroEmail = document.getElementById('erroEmail');
    const quantidadeLugares = document.getElementById('quantidadeLugares');
    const infoMesas = document.getElementById('infoMesas');
    const motivoReserva = document.getElementById('motivoReserva');
    const observacao = document.getElementById('observacao');
    const contador = document.getElementById('contador');
    const obsObrigatorio = document.getElementById('obsObrigatorio');
    const erroObs = document.getElementById('erroObs');
    const infoHorario = document.getElementById('infoHorario');
    const resumoBox = document.getElementById('resumoBox');
    const resumoConteudo = document.getElementById('resumoConteudo');
    const mensagemSucesso = document.getElementById('mensagemSucesso');
    const loading = document.getElementById('loading');
    const btnEnviar = document.getElementById('btnEnviar');
    const grupoPagamento = document.getElementById('grupoPagamento');
    const linkPagamento = document.getElementById('linkPagamento');
    const erroPagamento = document.getElementById('erroPagamento');
    const grupoCodigo = document.getElementById('grupoCodigo');
    const codigoTransacao = document.getElementById('codigoTransacao');
    const erroCodigo = document.getElementById('erroCodigo');
    const mesaInfo = document.getElementById('mesaInfo');
    const erroMesa = document.getElementById('erroMesa');
    const erroMesaOcupada = document.getElementById('erroMesaOcupada');
    const erroConflito = document.getElementById('erroConflito');

    const hoje = new Date();
    hoje.setHours(0, 0, 0, 0);
    let dataSelecionada = null;
    let mesAtual = hoje.getMonth();
    let anoAtual = hoje.getFullYear();
    let mesaInicial = null;
    let sequenciaSelecionada = [];
    const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

    function formatarMoeda(v) {
      return 'R$ ' + v.toFixed(2).replace('.', ',');
    }
    function formatarHora(h, m) {
      return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
    }
    function formatarData(d) {
      const dd = String(d.getDate()).padStart(2, '0');
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      return d.getFullYear() + '-' + mm + '-' + dd;
    }
    function quebrarData(dataStr) {
      const partes = dataStr.split('-').map(Number);
      return { ano: partes[0], mes: partes[1], dia: partes[2] };
    }

    function obterAbertura(dataStr) {
      const { ano, mes, dia } = quebrarData(dataStr);
      return HORARIOS_ABERTURA[new Date(ano, mes - 1, dia).getDay()] || null;
    }
    function obterPrazoReserva(dataStr) {
      const abertura = obterAbertura(dataStr);
      if (!abertura) return null;
      const { ano, mes, dia } = quebrarData(dataStr);
      const prazo = new Date(ano, mes - 1, dia, abertura.h, abertura.m);
      prazo.setMinutes(prazo.getMinutes() - ANTECEDENCIA_MIN);
      return prazo;
    }
    function reservaEncerrada(dataStr) {
      const prazo = obterPrazoReserva(dataStr);
      if (!prazo) return false;
      return new Date() >= prazo;
    }

    function limparSelecao() {
      mesaInicial = null;
      sequenciaSelecionada = [];
      document.querySelectorAll('.mesa.selecionada, .mesa.sugerida').forEach(function (m) {
        m.classList.remove('selecionada', 'sugerida');
      });
      mesaInfo.textContent = 'nenhuma';
      atualizarResumo();
    }

    function atualizarVisibilidadeMapa() {
      if (dataSelecionada) {
        avisoSemData.style.display = 'none';
        mapaContainer.style.display = 'block';
      } else {
        avisoSemData.style.display = 'block';
        mapaContainer.style.display = 'none';
        limparSelecao();
      }
    }

    function atualizarResumo() {
      if (!dataSelecionada) { resumoBox.style.display = 'none'; return; }
      const partes = dataSelecionada.split('-');
      const dataBR = partes[2] + '/' + partes[1] + '/' + partes[0];
      const abertura = obterAbertura(dataSelecionada);
      const atracao = AGENDA[dataSelecionada];
      const lugares = parseInt(quantidadeLugares.value, 10) || 0;
      const qtd = qtdMesasPorPessoas(lugares);
      const tipo = document.querySelector('input[name="tipoReserva"]:checked');
      const custo = qtd * VALOR_MESA;
      const linhas = [];
      linhas.push('<div><strong>Data:</strong> ' + dataBR + (abertura ? ' (abre às ' + formatarHora(abertura.h, abertura.m) + ')' : '') + '</div>');
      if (atracao) linhas.push('<div><strong>Atração:</strong> 🎤 ' + atracao + '</div>');
      if (lugares) linhas.push('<div><strong>Pessoas:</strong> ' + lugares + ' (' + qtd + ' mesa' + (qtd > 1 ? 's' : '') + ')</div>');
      if (sequenciaSelecionada.length) linhas.push('<div><strong>Mesas:</strong> ' + sequenciaSelecionada.join(' e ') + '</div>');
      if (tipo) linhas.push('<div><strong>Tipo:</strong> ' + (tipo.value === 'garantida' ? 'Garantida' : 'Sem garantia') + '</div>');
      if (tipo && tipo.value === 'garantida') {
        linhas.push('<div><strong>Valor da reserva:</strong> ' + qtd + ' × ' + formatarMoeda(VALOR_MESA) + ' = <strong>' + formatarMoeda(custo) + '</strong></div>');
      }
      resumoConteudo.innerHTML = linhas.join('');
      resumoBox.style.display = 'block';
    }

    function atualizarValorTaxa() {
      const lugares = parseInt(quantidadeLugares.value, 10) || 0;
      const qtd = qtdMesasPorPessoas(lugares);
      const custo = qtd * VALOR_MESA;
      const taxaPorMesa = document.getElementById('taxaPorMesaTexto');
      if (taxaPorMesa) taxaPorMesa.textContent = formatarMoeda(VALOR_MESA);
      if (linkPagamento) linkPagamento.textContent = '💳 Pagar taxa de ' + formatarMoeda(custo);
    }

    function carregarAgenda() {
      fetch(APPS_SCRIPT_URL + '?aba=agenda')
        .then(function (res) { return res.json(); })
        .then(function (dados) {
          if (dados && !dados.error) {
            AGENDA = dados;
            renderCalendario();
            atualizarResumo();
          }
        })
        .catch(function () { AGENDA = {}; });
    }

    function carregarLinkTaxa() {
      fetch(APPS_SCRIPT_URL + '?aba=pagamento')
        .then(function (res) { return res.json(); })
        .then(function (dados) {
          linkTaxa = (dados && !dados.error && dados.link) ? dados.link : null;
        })
        .catch(function () { linkTaxa = null; })
        .then(function () { atualizarBotaoPagamento(); });
    }

    function atualizarBotaoPagamento() {
      const tipo = document.querySelector('input[name="tipoReserva"]:checked').value;
      if (tipo === 'garantida') {
        grupoPagamento.style.display = 'block';
        atualizarValorTaxa();
        if (linkTaxa) {
          linkPagamento.href = linkTaxa;
          linkPagamento.classList.remove('disabled');
          erroPagamento.style.display = 'none';
        } else {
          linkPagamento.classList.add('disabled');
          erroPagamento.style.display = 'block';
        }
      } else {
        grupoPagamento.style.display = 'none';
        grupoCodigo.style.display = 'none';
      }
    }

    document.querySelectorAll('input[name="tipoReserva"]').forEach(function (radio) {
      radio.addEventListener('change', function () {
        atualizarBotaoPagamento();
        atualizarResumo();
      });
    });

    linkPagamento.addEventListener('click', function () {
      cliqueLinkTaxa = new Date().toLocaleString('pt-BR');
      grupoCodigo.style.display = 'block';
    });

    function renderCalendario() {
      calTitle.textContent = MESES[mesAtual] + ' ' + anoAtual;
      calDays.innerHTML = '';
      const primeiroDia = new Date(anoAtual, mesAtual, 1);
      const diasNoMes = new Date(anoAtual, mesAtual + 1, 0).getDate();
      const inicioSemana = primeiroDia.getDay();
      for (let i = 0; i < inicioSemana; i++) {
        const vazio = document.createElement('div');
        vazio.className = 'cal-day empty';
        calDays.appendChild(vazio);
      }
      for (let dia = 1; dia <= diasNoMes; dia++) {
        const celula = document.createElement('div');
        celula.className = 'cal-day';
        celula.textContent = dia;
        const data = new Date(anoAtual, mesAtual, dia);
        const dataStr = formatarData(data);
        const atracao = AGENDA[dataStr];
        if (atracao) {
          const hint = document.createElement('span');
          hint.className = 'tooltip';
          hint.textContent = atracao;
          celula.appendChild(hint);
        }
        if (data < hoje) {
          celula.classList.add('past');
        } else {
          const abertura = obterAbertura(dataStr);
          if (!abertura) {
            celula.classList.add('fechado');
            const tip = document.createElement('span');
            tip.className = 'tooltip fechado-tip';
            tip.textContent = 'Pub fechado neste dia';
            celula.appendChild(tip);
          } else if (reservaEncerrada(dataStr)) {
            celula.classList.add('encerrada');
            const prazo = obterPrazoReserva(dataStr);
            const tip = document.createElement('span');
            tip.className = 'tooltip encerrada-tip';
            tip.textContent = 'Reservas encerradas às ' + formatarHora(prazo.getHours(), prazo.getMinutes());
            celula.appendChild(tip);
          } else {
            if (dataStr === formatarData(hoje)) celula.classList.add('today');
            if (dataStr === dataSelecionada) celula.classList.add('selected');
            celula.addEventListener('click', function (e) {
              e.stopPropagation();
              dataSelecionada = dataStr;
              dataReserva.value = dia + '/' + (mesAtual + 1) + '/' + anoAtual;
              calendarPopup.classList.remove('open');
              erroConflito.style.display = 'none';
              erroMesaOcupada.style.display = 'none';
              const aberturaSel = obterAbertura(dataStr);
              const prazoSel = obterPrazoReserva(dataStr);
              infoHorario.innerHTML = '🕗 O Pub abre às <strong>' + formatarHora(aberturaSel.h, aberturaSel.m) + '</strong> neste dia.<br>⏰ Reservas para este dia até <strong>' + formatarHora(prazoSel.getHours(), prazoSel.getMinutes()) + '</strong>.';
              infoHorario.classList.add('show');
              limparSelecao();
              renderCalendario();
              atualizarVisibilidadeMapa();
              carregarMesasOcupadas(dataStr);
            });
          }
        }
        calDays.appendChild(celula);
      }
    }

    dataReserva.addEventListener('click', function (e) {
      e.stopPropagation();
      calendarPopup.classList.toggle('open');
      renderCalendario();
    });
    document.getElementById('prevMonth').addEventListener('click', function (e) {
      e.stopPropagation();
      mesAtual--;
      if (mesAtual < 0) { mesAtual = 11; anoAtual--; }
      renderCalendario();
    });
    document.getElementById('nextMonth').addEventListener('click', function (e) {
      e.stopPropagation();
      mesAtual++;
      if (mesAtual > 11) { mesAtual = 0; anoAtual++; }
      renderCalendario();
    });
    document.addEventListener('click', function (e) {
      if (!e.target.closest('.date-wrapper')) calendarPopup.classList.remove('open');
    });

    observacao.addEventListener('input', function () {
      const len = this.value.length;
      contador.textContent = len + ' / 200';
      contador.classList.toggle('limit', len >= 200);
    });
    telefone.addEventListener('input', function () {
      const digits = this.value.replace(/\D/g, '').slice(0, 11);
      let formatted = '';
      if (digits.length <= 2) formatted = '(' + digits;
      else if (digits.length <= 6) formatted = '(' + digits.slice(0, 2) + ') ' + digits.slice(2);
      else if (digits.length <= 10) formatted = '(' + digits.slice(0, 2) + ') ' + digits.slice(2, 6) + '-' + digits.slice(6);
      else formatted = '(' + digits.slice(0, 2) + ') ' + digits.slice(2, 7) + '-' + digits.slice(7);
      this.value = formatted;
    });

    function atualizarObrigatorioObs() {
      const lugares = parseInt(quantidadeLugares.value, 10) || 0;
      obsObrigatorio.style.display = (lugares >= LIMITE_PESSOAS) ? 'inline' : 'none';
    }

    quantidadeLugares.addEventListener('input', function () {
      const n = parseInt(this.value, 10) || 0;
      const qtd = qtdMesasPorPessoas(n);
      document.getElementById('qtdMesasInfo').textContent = qtd;
      infoMesas.style.display = n >= 1 ? 'block' : 'none';
      limparSelecao();
      erroMesa.style.display = 'none';
      erroMesaOcupada.style.display = 'none';
      erroConflito.style.display = 'none';
      atualizarValorTaxa();
      atualizarObrigatorioObs();
    });

    function qtdMesasPorPessoas(lugares) {
      const n = Number(lugares) || 0;
      if (n <= 0) return 1;
      return Math.max(1, Math.ceil(n / CAPACIDADE_MESA));
    }

    function marcarSequencia(inicio, qtd) {
      document.querySelectorAll('.mesa.selecionada, .mesa.sugerida').forEach(function (m) {
        m.classList.remove('selecionada', 'sugerida');
      });
      const seq = [];
      for (let i = 0; i < qtd; i++) seq.push(inicio + i);
      seq.forEach(function (n) {
        const el = document.querySelector('.mesa[data-mesa="' + n + '"]');
        if (el) el.classList.add('selecionada');
      });
      return seq;
    }

    function aplicarOcupadas(lista) {
      mesasOcupadas = lista;
      document.querySelectorAll('.mesa').forEach(function (mesa) {
        const num = parseInt(mesa.getAttribute('data-mesa'), 10);
        if (lista.indexOf(num) >= 0) mesa.classList.add('ocupada');
        else mesa.classList.remove('ocupada');
      });
    }

    function carregarMesasOcupadas(dataStr) {
      document.querySelectorAll('.mesa.ocupada').forEach(function (m) { m.classList.remove('ocupada'); });
      if (!dataStr) return;
      fetch(APPS_SCRIPT_URL + '?aba=mesas&data=' + encodeURIComponent(dataStr))
        .then(function (res) { return res.json(); })
        .then(function (dados) {
          if (dados && dados.error) console.warn('mesas:', dados.error);
          if (dados && Array.isArray(dados.mesasOcupadas)) {
            aplicarOcupadas(dados.mesasOcupadas);
            totalPessoasData = dados.totalPessoas || 0;
            limiteAtingido = totalPessoasData >= LIMITE_PESSOAS;
            atualizarBannerLimite();
            atualizarBotaoPagamento();
          }
        })
        .catch(function () {});
    }

    function atualizarBannerLimite() {
      if (limiteAtingido) {
        bannerLimite.style.display = 'block';
        bannerLimite.textContent = '⚠️ Esta data atingiu o limite de ' + LIMITE_PESSOAS + ' pessoas. Selecione uma mesa e registre seus comentários no campo Observação para solicitação manual.';
      } else {
        bannerLimite.style.display = 'none';
      }
    }

    document.querySelectorAll('.mesa').forEach(function (mesa) {
      mesa.addEventListener('click', function () {
        if (mesa.classList.contains('ocupada')) {
          erroMesaOcupada.textContent = 'A mesa ' + mesa.getAttribute('data-mesa') + ' já está reservada para a data escolhida. Escolha outra mesa.';
          erroMesaOcupada.style.display = 'block';
          return;
        }
        erroMesaOcupada.style.display = 'none';
        const num = parseInt(mesa.getAttribute('data-mesa'), 10);

        if (limiteAtingido) {
          limparSelecao();
          mesaInicial = num;
          sequenciaSelecionada = [num];
          mesa.classList.add('selecionada');
          mesaInfo.textContent = 'Mesa ' + num;
          erroMesa.style.display = 'none';
          erroConflito.style.display = 'none';
          atualizarResumo();
          return;
        }

        const lugares = parseInt(quantidadeLugares.value, 10) || 0;
        const qtd = qtdMesasPorPessoas(lugares);
        if (num + qtd - 1 > MAX_MESA) {
          erroMesaOcupada.textContent = 'A sequência a partir da mesa ' + num + ' excede a mesa ' + MAX_MESA + '. Escolha outra mesa inicial.';
          erroMesaOcupada.style.display = 'block';
          return;
        }
        const seq = [];
        for (let i = 0; i < qtd; i++) seq.push(num + i);
        const bloqueada = seq.some(function (n) { return mesasOcupadas.indexOf(n) >= 0; });
        if (bloqueada) {
          let inicioSug = 1;
          let achou = false;
          for (let s = 1; s + qtd - 1 <= MAX_MESA && !achou; s++) {
            let ok = true;
            for (let k = 0; k < qtd; k++) if (mesasOcupadas.indexOf(s + k) >= 0) { ok = false; break; }
            if (ok) { inicioSug = s; achou = true; }
          }
          if (achou) {
            document.querySelectorAll('.mesa.sugerida').forEach(function (m) { m.classList.remove('sugerida'); });
            for (let k = 0; k < qtd; k++) {
              const el = document.querySelector('.mesa[data-mesa="' + (inicioSug + k) + '"]');
              if (el) el.classList.add('sugerida');
            }
            erroMesaOcupada.textContent = 'A mesa ' + num + ' não comporta ' + lugares + ' pessoas nesta data. Sugestão: mesas ' + inicioSug + ' a ' + (inicioSug + qtd - 1) + '.';
          } else {
            erroMesaOcupada.textContent = 'Não há sequência de ' + qtd + ' mesas livres para esta data.';
          }
          erroMesaOcupada.style.display = 'block';
          return;
        }
        limparSelecao();
        mesaInicial = num;
        sequenciaSelecionada = marcarSequencia(num, qtd);
        mesaInfo.textContent = 'Mesas ' + sequenciaSelecionada.join(' e ');
        erroMesa.style.display = 'none';
        erroConflito.style.display = 'none';
        atualizarResumo();
      });
    });

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      mensagemSucesso.style.display = 'none';
      erroConflito.style.display = 'none';
      erroMesaOcupada.style.display = 'none';
      let valido = true;
      if (!dataSelecionada) {
        document.getElementById('erroData').textContent = 'Selecione uma data válida.';
        document.getElementById('erroData').style.display = 'block'; valido = false;
      } else if (reservaEncerrada(dataSelecionada)) {
        const prazo = obterPrazoReserva(dataSelecionada);
        document.getElementById('erroData').textContent = 'As reservas para este dia encerram às ' + formatarHora(prazo.getHours(), prazo.getMinutes()) + '. Escolha outro dia.';
        document.getElementById('erroData').style.display = 'block'; valido = false;
      } else {
        document.getElementById('erroData').style.display = 'none';
      }
      if (!nomeReserva.value.trim()) { document.getElementById('erroNome').style.display = 'block'; valido = false; }
      else { document.getElementById('erroNome').style.display = 'none'; }
      const telefoneDigits = telefone.value.replace(/\D/g, '');
      if (telefoneDigits.length < 10 || telefoneDigits.length > 11) { document.getElementById('erroTelefone').style.display = 'block'; valido = false; }
      else { document.getElementById('erroTelefone').style.display = 'none'; }
      const emailVal = emailReserva.value.trim();
      if (emailVal && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailVal)) { erroEmail.style.display = 'block'; valido = false; }
      else { erroEmail.style.display = 'none'; }
      const lugares = parseInt(quantidadeLugares.value, 10);
      if (!lugares || lugares < 1 || lugares > 270) { document.getElementById('erroLugares').style.display = 'block'; valido = false; }
      else { document.getElementById('erroLugares').style.display = 'none'; }
      if (!motivoReserva.value) { document.getElementById('erroMotivo').style.display = 'block'; valido = false; }
      else { document.getElementById('erroMotivo').style.display = 'none'; }
      if ((lugares >= LIMITE_PESSOAS || limiteAtingido) && !observacao.value.trim()) { erroObs.style.display = 'block'; valido = false; }
      else { erroObs.style.display = 'none'; }
      if (sequenciaSelecionada.length === 0) { erroMesa.style.display = 'block'; valido = false; }
      else { erroMesa.style.display = 'none'; }
      if (grupoCodigo.style.display === 'block' && !codigoTransacao.value.trim()) { erroCodigo.style.display = 'block'; valido = false; }
      else { erroCodigo.style.display = 'none'; }
      if (!valido) return;

      const tipoReserva = document.querySelector('input[name="tipoReserva"]:checked').value;
      const dataReservada = dataSelecionada;
      const payload = {
        data: dataReservada,
        mesa: mesaInicial,
        tipoReserva: tipoReserva,
        linkTaxa: linkTaxa,
        linkClique: cliqueLinkTaxa,
        codigoTransacao: codigoTransacao.value.trim(),
        email: emailVal,
        nome: nomeReserva.value.trim(),
        telefone: telefone.value.trim(),
        lugares: lugares,
        motivo: motivoReserva.value,
        observacao: observacao.value.trim()
      };

      btnEnviar.disabled = true;
      loading.style.display = 'block';

      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(payload)
      })
      .then(function (res) { return res.json(); })
      .then(function (resp) {
        loading.style.display = 'none';
        btnEnviar.disabled = false;
        if (resp && resp.ok) {
          mensagemSucesso.style.display = 'block';
          form.reset();
          contador.textContent = '0 / 200';
          dataSelecionada = null;
          limparSelecao();
          cliqueLinkTaxa = '';
          infoHorario.classList.remove('show');
          infoHorario.innerHTML = '';
          infoMesas.style.display = 'none';
          grupoCodigo.style.display = 'none';
          obsObrigatorio.style.display = 'none';
          atualizarValorTaxa();
          atualizarBotaoPagamento();
          atualizarVisibilidadeMapa();
          carregarMesasOcupadas(dataReservada);
        } else {
          var erroTexto = mensagemAmigavel(resp && resp.erro);
          if (resp && resp.sugestao) {
            document.querySelectorAll('.mesa.sugerida').forEach(function (m) { m.classList.remove('sugerida'); });
            resp.sugestao.forEach(function (n) {
              const el = document.querySelector('.mesa[data-mesa="' + n + '"]');
              if (el) el.classList.add('sugerida');
            });
          }
          erroConflito.textContent = erroTexto;
          erroConflito.style.display = 'block';
          carregarMesasOcupadas(dataReservada);
        }
      })
      .catch(function () {
        loading.style.display = 'none';
        btnEnviar.disabled = false;
        alert('Não foi possível conectar ao servidor. Verifique se o Apps Script está publicado com acesso "Qualquer pessoa" e se a URL está correta.');
      });
    });

    function mensagemAmigavel(erro) {
      if (!erro) return 'Não foi possível registrar a reserva. Tente novamente.';
      var e = String(erro);
      if (e.indexOf('não está disponível') > -1 || e.indexOf('Sugestão') > -1) return e;
      if (e.indexOf('ERRO DE CONFIGURAÇÃO') > -1) return 'Configuração pendente: não foi possível ler as datas da planilha. Fale com a gente pelo WhatsApp (14) 99111-7806 ou tente novamente em instantes.';
      if (e.indexOf('Sistema ocupado') > -1) return 'O sistema está processando outro pedido no momento. Tente novamente em instantes.';
      if (e.indexOf('Data inválida') > -1) return 'A data escolhida não é válida. Selecione outra data.';
      if (e.indexOf('Limite de') > -1) return e;
      return e;
    }

    atualizarVisibilidadeMapa();
    atualizarValorTaxa();
    atualizarObrigatorioObs();
    carregarAgenda();
    carregarLinkTaxa();
  </script>
