<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Villa Velha Pub - Seleção de Mesa</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #14141f; color: #fff; padding: 20px; }
  h1 { text-align: center; margin-bottom: 6px; font-size: 22px; }
  .sub { text-align: center; color: #aaa; font-size: 13px; margin-bottom: 20px; }

  .container { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }

  .mapa {
    position: relative;
    width: 500px;
    max-width: 100%;
    border-radius: 10px;
    overflow: hidden;
    border: 2px solid #333;
    background: #000;
  }
  .mapa img { width: 100%; display: block; }

  .mesa {
    position: absolute;
    width: 30px; height: 30px;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-weight: bold; font-size: 10px; color: #fff;
    background: rgba(0, 140, 255, 0.6);
    border: 2px solid #fff;
    transition: transform 0.15s, background 0.15s;
    user-select: none;
    z-index: 2;
  }
  .mesa:hover { transform: translate(-50%, -50%) scale(1.25); z-index: 5; }
  .mesa.ocupada { background: rgba(255, 0, 0, 0.65); cursor: not-allowed; }
  .mesa.selecionada { background: rgba(0, 200, 100, 0.85); }

  .painel {
    width: 300px;
    background: #1e1e2e;
    border-radius: 10px;
    padding: 16px;
    max-height: 600px;
    overflow-y: auto;
  }
  .painel h3 { margin-bottom: 10px; font-size: 15px; }
  .reg { padding: 7px 10px; border-radius: 6px; margin-bottom: 6px; font-size: 13px; background: #2a2a3e; }
  .reg.ok { border-left: 4px solid #00c864; }
  .reg.erro { border-left: 4px solid #ff4444; }
  .reg.info { border-left: 4px solid #ffaa00; }
  .stats { margin-top: 10px; font-size: 13px; color: #ccc; }
  .btn-limpar { margin-top: 10px; width: 100%; padding: 8px; border: none; border-radius: 6px;
    background: #ff4444; color: #fff; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>

<h1>🍺 Villa Velha Pub - Seleção de Mesa</h1>
<p class="sub">Clique em uma mesa para testar a seleção e o registro na base de dados</p>

<div class="container">
  <div class="mapa">
    <img src="https://raw.githubusercontent.com/pubvillavelha-oss/Reservas_VVP/main/MAPA%20SALAO%20VVP.png" alt="Mapa do salão do Villa Velha Pub">

    <!-- ================= LADO ESQUERDO ================= -->
    <!-- Fileira 1 (frente) -->
    <div class="mesa" data-mesa="20" style="left:44%;top:17%">20</div>

    <!-- Fileira 2 -->
    <div class="mesa" data-mesa="19" style="left:44%;top:30%">19</div>
    <div class="mesa" data-mesa="14" style="left:33%;top:30%">14</div>
    <div class="mesa" data-mesa="9" style="left:21%;top:30%">9</div>

    <!-- Fileira 3 -->
    <div class="mesa" data-mesa="4" style="left:12%;top:45%">4</div>
    <div class="mesa" data-mesa="8" style="left:23%;top:45%">8</div>
    <div class="mesa" data-mesa="13" style="left:33%;top:45%">13</div>
    <div class="mesa" data-mesa="18" style="left:44%;top:45%">18</div>

    <!-- Fileira 4 -->
    <div class="mesa" data-mesa="3" style="left:12%;top:58%">3</div>
    <div class="mesa" data-mesa="7" style="left:23%;top:58%">7</div>
    <div class="mesa" data-mesa="12" style="left:33%;top:58%">12</div>
    <div class="mesa" data-mesa="17" style="left:44%;top:58%">17</div>

    <!-- Fileira 5 -->
    <div class="mesa" data-mesa="2" style="left:12%;top:70%">2</div>
    <div class="mesa" data-mesa="6" style="left:23%;top:70%">6</div>
    <div class="mesa" data-mesa="11" style="left:33%;top:70%">11</div>
    <div class="mesa" data-mesa="16" style="left:44%;top:70%">16</div>

    <!-- Fileira 6 (fundo) -->
    <div class="mesa" data-mesa="1" style="left:12%;top:83%">1</div>
    <div class="mesa" data-mesa="5" style="left:23%;top:83%">5</div>
    <div class="mesa" data-mesa="10" style="left:33%;top:83%">10</div>
    <div class="mesa" data-mesa="15" style="left:44%;top:83%">15</div>

    <!-- ================= LADO DIREITO ================= -->
    <!-- Fileira 1 (frente) -->
    <div class="mesa" data-mesa="27" style="left:61%;top:05%">27</div>
    <div class="mesa" data-mesa="34" style="left:72%;top:05%">34</div>
    <div class="mesa" data-mesa="41" style="left:82%;top:05%">41</div>
    <div class="mesa" data-mesa="46" style="left:92%;top:05%">46</div>

    <!-- Fileira 2 -->
    <div class="mesa" data-mesa="26" style="left:61%;top:18%">26</div>
    <div class="mesa" data-mesa="33" style="left:72%;top:18%">33</div>
    <div class="mesa" data-mesa="40" style="left:83%;top:18%">40</div>
    <div class="mesa" data-mesa="45" style="left:93%;top:18%">45</div>

    <!-- Fileira 3 -->
    <div class="mesa" data-mesa="25" style="left:61%;top:31%">25</div>
    <div class="mesa" data-mesa="32" style="left:72%;top:31%">32</div>
    <div class="mesa" data-mesa="39" style="left:83%;top:31%">39</div>
    <div class="mesa" data-mesa="43" style="left:93%;top:31%">43</div>

    <!-- Fileira 4 -->
    <div class="mesa" data-mesa="24" style="left:61%;top:44%">24</div>
    <div class="mesa" data-mesa="31" style="left:72%;top:44%">31</div>
    <div class="mesa" data-mesa="38" style="left:83%;top:44%">38</div>
    <div class="mesa" data-mesa="42" style="left:93%;top:44%">42</div>

    <!-- Fileira 5 -->
    <div class="mesa" data-mesa="23" style="left:61%;top:57%">23</div>
    <div class="mesa" data-mesa="30" style="left:72%;top:57%">30</div>
    <div class="mesa" data-mesa="37" style="left:83%;top:57%">37</div>

    <!-- Fileira 6 -->
    <div class="mesa" data-mesa="22" style="left:61%;top:70%">22</div>
    <div class="mesa" data-mesa="29" style="left:72%;top:70%">29</div>
    <div class="mesa" data-mesa="36" style="left:83%;top:70%">36</div>

    <!-- Fileira 7 (fundo) -->
    <div class="mesa" data-mesa="21" style="left:61%;top:83%">21</div>
    <div class="mesa" data-mesa="28" style="left:72%;top:83%">28</div>
    <div class="mesa" data-mesa="35" style="left:83%;top:83%">35</div>
  </div>

  <div class="painel">
    <h3>📋 Registro de seleção</h3>
    <div id="log"></div>
    <div class="stats" id="stats">Total de mesas: 46</div>
    <button class="btn-limpar" onclick="limpar()">Limpar registro</button>
  </div>
</div>

<script>
  const banco = [];
  const log = document.getElementById('log');
  const stats = document.getElementById('stats');

  function registrar(tipo, texto) {
    const div = document.createElement('div');
    div.className = 'reg ' + tipo;
    div.textContent = texto;
    log.prepend(div);
  }

  document.querySelectorAll('.mesa').forEach(mesa => {
    mesa.addEventListener('click', () => {
      const numero = mesa.dataset.mesa;
      if (mesa.classList.contains('ocupada')) {
        registrar('erro', `❌ Mesa ${numero} está OCUPADA`);
        return;
      }
      mesa.classList.toggle('selecionada');
      const selecionada = mesa.classList.contains('selecionada');
      const hora = new Date().toLocaleTimeString();
      banco.push({ mesa: numero, hora, selecionada });
      registrar(selecionada ? 'ok' : 'info',
        `${selecionada ? '✅' : '↩️'} Mesa ${numero} ${selecionada ? 'SELECIONADA' : 'desmarcada'} às ${hora}`);
      const selecionadas = document.querySelectorAll('.mesa.selecionada').length;
      stats.textContent = `Total: 46 | Selecionadas: ${selecionadas} | Registros: ${banco.length}`;
      console.log('Base de dados:', banco);
    });
  });

  function limpar() {
    banco.length = 0;
    log.innerHTML = '';
    stats.textContent = 'Total de mesas: 46';
    document.querySelectorAll('.mesa.selecionada').forEach(m => m.classList.remove('selecionada'));
  }
</script>
</body>
</html>
