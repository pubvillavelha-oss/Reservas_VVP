<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Villa Velha Pub - Escolha sua mesa</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #14141f; color: #fff; padding: 20px; }
  h1 { text-align: center; margin-bottom: 4px; font-size: 24px; }
  .sub { text-align: center; color: #aaa; font-size: 13px; margin-bottom: 16px; }

  .topo { display: flex; justify-content: center; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
  .topo label { color: #ccc; font-size: 14px; }
  .topo input[type="date"] {
    background: #1e1e2e; color: #fff; border: 1px solid #444;
    padding: 8px 12px; border-radius: 6px; font-size: 14px;
  }

  .legenda { display: flex; justify-content: center; gap: 20px; margin-bottom: 16px; font-size: 13px; color: #ccc; flex-wrap: wrap; }
  .legenda span { display: inline-flex; align-items: center; gap: 6px; }
  .bolinha { width: 14px; height: 14px; border-radius: 50%; display: inline-block; border: 1px solid #fff; }
  .b-livre { background: rgba(0, 140, 255, 0.6); }
  .b-ocupada { background: rgba(255, 0, 0, 0.6); }
  .b-selecionada { background: rgba(0, 200, 100, 0.85); }

  .container { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }

  .mapa {
    position: relative; width: 520px; max-width: 100%;
    border-radius: 10px; overflow: hidden; border: 2px solid #333; background: #000;
  }
  .mapa img { width: 100%; display: block; }

  .mesa {
    position: absolute; width: 32px; height: 32px; border-radius: 50%;
    transform: translate(-50%, -50%); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-weight: bold; font-size: 11px; color: #fff;
    background: rgba(0, 140, 255, 0.6); border: 2px solid #fff;
    transition: transform 0.15s, background 0.15s; user-select: none; z-index: 2;
  }
  .mesa:hover { transform: translate(-50%, -50%) scale(1.2); z-index: 5; }
  .mesa.ocupada { background: rgba(255, 0, 0, 0.65); cursor: not-allowed; }
  .mesa.selecionada { background: rgba(0, 200, 100, 0.9); border-color: #fff; z-index: 6; }
  .mesa.carregando { opacity: 0.5; pointer-events: none; }

  .painel { width: 300px; background: #1e1e2e; border-radius: 10px; padding: 18px; align-self: flex-start; }
  .painel h3 { margin-bottom: 10px; font-size: 15px; }
  .info { font-size: 14px; color: #ccc; line-height: 1.6; margin-bottom: 12px; }
  .info strong { color: #fff; }
  .btn {
    width: 100%; padding: 12px; border: none; border-radius: 8px;
    font-weight: bold; font-size: 14px; cursor: pointer; margin-top: 8px;
  }
  .btn-reservar { background: #00c864; color: #fff; }
  .btn-reservar:disabled { background: #2a5a40; color: #888; cursor: not-allowed; }
  .btn-limpar { background: #ff4444; color: #fff; }
  .msg { margin-top: 10px; font-size: 13px; padding: 8px; border-radius: 6px; background: #2a2a3e; }
  .msg.erro { border-left: 4px solid #ff4444; }
  .msg.ok { border-left: 4px solid #00c864; }
</style>
</head>
<body>

<h1>🍺 Villa Velha Pub</h1>
<p class="sub">Escolha sua mesa e faça sua reserva</p>

<div class="topo">
  <label for="dataReserva">📅 Data da reserva:</label>
  <input type="date" id="dataReserva">
</div>

<div class="legenda">
  <span><i class="bolinha b-livre"></i> Disponível</span>
  <span><i class="bolinha b-ocupada"></i> Ocupada</span>
  <span><i class="bolinha b-selecionada"></i> Selecionada</span>
</div>

<div class="container">
  <div class="mapa">
    <img src="https://raw.githubusercontent.com/pubvillavelha-oss/Reservas_VVP/main/MAPA%20SALAO%20VVP.png" alt="Mapa do salão do Villa Velha Pub">

    <!-- ===== LADO ESQUERDO (frente para o fundo) ===== -->
    <div class="mesa" data-mesa="20" style="left:12%;top:15%">20</div>

    <div class="mesa" data-mesa="19" style="left:12%;top:25%">19</div>
    <div class="mesa" data-mesa="14" style="left:22%;top:25%">14</div>
    <div class="mesa" data-mesa="9"  style="left:32%;top:25%">9</div>

    <div class="mesa" data-mesa="4"  style="left:12%;top:35%">4</div>
    <div class="mesa" data-mesa="8"  style="left:22%;top:35%">8</div>
    <div class="mesa" data-mesa="13" style="left:32%;top:35%">13</div>
    <div class="mesa" data-mesa="18" style="left:42%;top:35%">18</div>

    <div class="mesa" data-mesa="3"  style="left:12%;top:45%">3</div>
    <div class="mesa" data-mesa="7"  style="left:22%;top:45%">7</div>
    <div class="mesa" data-mesa="12" style="left:32%;top:45%">12</div>
    <div class="mesa" data-mesa="17" style="left:42%;top:45%">17</div>

    <div class="mesa" data-mesa="2"  style="left:12%;top:55%">2</div>
    <div class="mesa" data-mesa="6"  style="left:22%;top:55%">6</div>
    <div class="mesa" data-mesa="11" style="left:32%;top:55%">11</div>
    <div class="mesa" data-mesa="16" style="left:42%;top:55%">16</div>

    <div class="mesa" data-mesa="1"  style="left:12%;top:65%">1</div>
    <div class="mesa" data-mesa="5"  style="left:22%;top:65%">5</div>
    <div class="mesa" data-mesa="10" style="left:32%;top:65%">10</div>
    <div class="mesa" data-mesa="15" style="left:42%;top:65%">15</div>

    <!-- ===== LADO DIREITO (frente para o fundo) ===== -->
    <div class="mesa" data-mesa="27" style="left:58%;top:12%">27</div>
    <div class="mesa" data-mesa="34" style="left:68%;top:12%">34</div>
    <div class="mesa" data-mesa="41" style="left:78%;top:12%">41</div>
    <div class="mesa" data-mesa="46" style="left:88%;top:12%">46</div>

    <div class="mesa" data-mesa="26" style="left:58%;top:20%">26</div>
    <div class="mesa" data-mesa="33" style="left:68%;top:20%">33</div>
    <div class="mesa" data-mesa="40" style="left:78%;top:20%">40</div>
    <div class="mesa" data-mesa="45" style="left:88%;top:20%">45</div>

    <div class="mesa" data-mesa="25" style="left:58%;top:28%">25</div>
    <div class="mesa" data-mesa="32" style="left:68%;top:28%">32</div>
    <div class="mesa" data-mesa="39" style="left:78%;top:28%">39</div>
    <div class="mesa" data-mesa="43" style="left:88%;top:28%">43</div>

    <div class="mesa" data-mesa="24" style="left:58%;top:36%">24</div>
    <div class="mesa" data-mesa="31" style="left:68%;top:36%">31</div>
    <div class="mesa" data-mesa="38" style="left:78%;top:36%">38</div>
    <div class="mesa" data-mesa="42" style="left:88%;top:36%">42</div>

    <div class="mesa" data-mesa="23" style="left:58%;top:44%">23</div>
    <div class="mesa" data-mesa="30" style="left:68%;top:44%">30</div>
    <div class="mesa" data-mesa="37" style="left:78%;top:44%">37</div>
    <div class="mesa" data-mesa="44" style="left:88%;top:44%">44</div>

    <div class="mesa" data-mesa="22" style="left:58%;top:52%">22</div>
    <div class="mesa" data-mesa="29" style="left:68%;top:52%">29</div>
    <div class="mesa" data-mesa="36" style="left:78%;top:52%">36</div>

    <div class="mesa" data-mesa="21" style="left:58%;top:60%">21</div>
    <div class="mesa" data-mesa="28" style="left:68%;top:60%">28</div>
    <div class="mesa" data-mesa="35" style="left:78%;top:60%">35</div>
  </div>

  <div class="painel">
    <h3>📋 Sua reserva</h3>
    <div class="info" id="infoMesa">Toque em uma mesa disponível para selecioná-la.</div>
    <button class="btn btn-reservar" id="btnReservar" disabled>Reservar esta mesa</button>
    <button class="btn btn-limpar" id="btnLimpar">Limpar seleção</button>
    <div class="msg" id="msg"></div>
  </div>
</div>

<script>
  // ============================================================
  // CONFIGURAÇÃO — preencha com os dados do seu projeto
  // ============================================================
  // URL do Apps Script (mesma usada no formulário de reserva).
  // Implante o Apps Script como "Web App" e cole aqui o link /exec.
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyQgdPbxLYCTl_X1A1-wN8NmrGHkRyKJR6xeOrCopBXS1JujMFAeoonhBNMnLlM1llEbw/exec';

  // Página do formulário de reserva (para onde o cliente vai após escolher a mesa)
  const FORM_URL = 'reserva_t.html';
  // ============================================================

  const dataInput = document.getElementById('dataReserva');
  const btnReservar = document.getElementById('btnReservar');
  const btnLimpar = document.getElementById('btnLimpar');
  const infoMesa = document.getElementById('infoMesa');
  const msg = document.getElementById('msg');
  const mesas = document.querySelectorAll('.mesa');

  let mesaSelecionada = null;
  let ocupadasHoje = [];

  // Data padrão = hoje (formato AAAA-MM-DD)
  function dataHoje() {
    const hoje = new Date();
    return hoje.getFullYear() + '-' +
      String(hoje.getMonth() + 1).padStart(2, '0') + '-' +
      String(hoje.getDate()).padStart(2, '0');
  }
  dataInput.value = dataHoje();

  // ===== Consulta as mesas ocupadas na data no Apps Script =====
  async function carregarOcupadas() {
    const data = dataInput.value;
    if (!data) return;

    // Estado de carregamento
    mesas.forEach(m => m.classList.add('carregando'));
    msg.className = 'msg';
    msg.textContent = 'Carregando disponibilidade...';

    try {
      const res = await fetch(APPS_SCRIPT_URL + '?aba=mesas&data=' + data);
      const dados = await res.json();

      ocupadasHoje = dados.mesasOcupadas || [];

      // Remove marcações anteriores e aplica as ocupadas da data
      mesas.forEach(m => {
        m.classList.remove('ocupada', 'selecionada');
        const n = Number(m.dataset.mesa);
        if (ocupadasHoje.indexOf(n) > -1) m.classList.add('ocupada');
      });

      mesaSelecionada = null;
      atualizarPainel();

      const livres = mesas.length - ocupadasHoje.length;
      msg.className = 'msg ok';
      msg.textContent = '✅ ' + livres + ' mesas disponíveis em ' + formatarDataBR(data);
    } catch (err) {
      msg.className = 'msg erro';
      msg.textContent = '⚠️ Não foi possível consultar as mesas. Verifique a URL do Apps Script e se ele foi implantado.';
      console.error(err);
    } finally {
      mesas.forEach(m => m.classList.remove('carregando'));
    }
  }

  // ===== Clique na mesa =====
  mesas.forEach(mesa => {
    mesa.addEventListener('click', () => {
      if (mesa.classList.contains('ocupada')) {
        msg.className = 'msg erro';
        msg.textContent = '❌ Mesa ' + mesa.dataset.mesa + ' já está ocupada nesta data.';
        return;
      }

      // Seleciona a mesa (só uma por vez)
      const n = Number(mesa.dataset.mesa);
      if (mesaSelecionada === n) {
        mesa.classList.remove('selecionada');
        mesaSelecionada = null;
      } else {
        document.querySelectorAll('.mesa.selecionada').forEach(m => m.classList.remove('selecionada'));
        mesa.classList.add('selecionada');
        mesaSelecionada = n;
      }
      atualizarPainel();
    });
  });

  function atualizarPainel() {
    if (mesaSelecionada === null) {
      infoMesa.textContent = 'Toque em uma mesa disponível para selecioná-la.';
      btnReservar.disabled = true;
      return;
    }
    infoMesa.innerHTML = 'Mesa selecionada: <strong>' + mesaSelecionada + '</strong><br>Data: <strong>' + formatarDataBR(dataInput.value) + '</strong>';
    btnReservar.disabled = false;
  }

  // ===== Confirmar reserva: guarda a mesa e vai para o formulário =====
  btnReservar.addEventListener('click', () => {
    if (mesaSelecionada === null) return;

    // Guarda a mesa + data para o formulário ler (mesma origem = mesmo navegador)
    localStorage.setItem('vvp_mesa', mesaSelecionada);
    localStorage.setItem('vvp_data', dataInput.value);

    msg.className = 'msg ok';
    msg.textContent = '✅ Mesa ' + mesaSelecionada + ' escolhida! Redirecionando para o formulário...';

    // Passa também por parâmetro na URL, caso o formulário prefira ler assim
    window.location.href = FORM_URL + '?mesa=' + mesaSelecionada + '&data=' + dataInput.value;
  });

  btnLimpar.addEventListener('click', () => {
    document.querySelectorAll('.mesa.selecionada').forEach(m => m.classList.remove('selecionada'));
    mesaSelecionada = null;
    atualizarPainel();
    msg.className = 'msg';
    msg.textContent = '';
  });

  // Ao trocar a data, recarrega a disponibilidade
  dataInput.addEventListener('change', carregarOcupadas);

  // ===== Formata AAAA-MM-DD para DD/MM/AAAA =====
  function formatarDataBR(valor) {
    if (!valor) return '';
    const m = String(valor).match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (m) return m[3] + '/' + m[2] + '/' + m[1];
    return valor;
  }

  // Carrega a disponibilidade ao abrir
  carregarOcupadas();
</script>
</body>
</html>
